<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowLedger</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>FlowLedger</h1>
    <p class="tagline">AI financial ops copilot</p>
  </header>
  <main>
    <section class="panel">
      <h2>Add transaction</h2>
      <form id="tx-form">
        <input name="description" placeholder="Description" required />
        <input name="amount" type="number" step="0.01" placeholder="Amount" required />
        <input name="category" placeholder="Category" value="uncategorized" />
        <button type="submit">Add</button>
      </form>
    </section>
    <section class="panel">
      <h2>Transactions</h2>
      <ul id="tx-list"></ul>
    </section>
    <section class="panel">
      <h2>Ask the agent</h2>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input name="message" placeholder="Why did my bill spike?" required />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
